name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-go:
    uses: juli3nk/ci-shared/.github/workflows/go-lint.yaml@main
    with:
      go_version: ${{ vars.GO_VERSION }}
      check_all: true

  deps:
    uses: juli3nk/ci-shared/.github/workflows/go-deps.yaml@main
    with:
      go_version: ${{ vars.GO_VERSION }}
      check_licenses: false

  build:
    needs: [lint-go, deps]
    uses: juli3nk/ci-shared/.github/workflows/go-build.yaml@main

  release:
    needs: build
    permissions:
      contents: write
    uses: juli3nk/ci-shared/.github/workflows/release.yaml@main

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
      packages: write
    uses: juli3nk/ci-shared/.github/workflows/go-publish.yaml@main
    with:
      released: ${{ needs.release.outputs.released }}
      tag: ${{ needs.release.outputs.tag }}
